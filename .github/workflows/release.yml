# pr2resolve release automation
# Maintainers create immutable semver tags manually; CI builds and publishes assets.
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate semver tag and source versions
        id: version
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag):
              raise SystemExit(f"FATAL: release tag must match vMAJOR.MINOR.PATCH, got: {tag}")

          version = tag.removeprefix("v")

          from pr2_constants import VERSION as source_version

          bat_text = Path("converter.bat").read_text(encoding="utf-8", errors="ignore")
          sh_text = Path("converter.sh").read_text(encoding="utf-8")
          bat_match = re.search(r'set "VERSION=([^"]+)"', bat_text)
          sh_match = re.search(r'VERSION="([^"]+)"', sh_text)
          versions = {
              "pr2_constants.py": source_version,
              "converter.bat": bat_match.group(1) if bat_match else "",
              "converter.sh": sh_match.group(1) if sh_match else "",
          }
          mismatches = {name: value for name, value in versions.items() if value != version}
          if mismatches:
              print(f"FATAL: version mismatch for tag {tag}")
              for name, value in versions.items():
                  print(f"  {name}: {value}")
              raise SystemExit(1)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"tag={tag}\n")
              fh.write(f"version={version}\n")
          PY

      - name: Check Python syntax
        run: |
          python -m py_compile pr2resolve.py
          python -m py_compile pr2_engine.py
          python -m py_compile pr2_constants.py
          python -m py_compile tui.py
          python -m py_compile .github/scripts/ci_smoke_tests.py

      - name: Run public smoke tests
        run: python .github/scripts/ci_smoke_tests.py

      - name: Verify workflow and issue template YAML
        run: |
          python -m pip install PyYAML
          python - <<'PY'
          from pathlib import Path
          import yaml

          paths = [
              Path(".github/workflows/ci.yml"),
              Path(".github/workflows/release.yml"),
              *Path(".github/ISSUE_TEMPLATE").glob("*.yml"),
          ]
          for path in paths:
              yaml.safe_load(path.read_text(encoding="utf-8"))
          print(f"Checked {len(paths)} YAML files")
          PY

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements-build.txt
          choco install upx -y

      - name: Build Windows package
        shell: pwsh
        run: powershell -File scripts/build_windows.ps1

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: dist/windows-x86_64/pr2resolve-v${{ needs.validate.outputs.version }}-windows-x86_64.zip
          if-no-files-found: error

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          python3 -m pip install -r requirements-build.txt
          brew install upx

      - name: Build macOS package
        run: bash scripts/build_macos.sh

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: dist/macos-*/pr2resolve-v${{ needs.validate.outputs.version }}-macos-*.tar.gz
          if-no-files-found: error

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          python3 -m pip install -r requirements-build.txt
          sudo apt-get update
          sudo apt-get install -y build-essential
          sudo apt-get install -y upx-ucl || sudo apt-get install -y upx

      - name: Build Linux package
        run: bash scripts/build_linux.sh

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: dist/linux-x86_64/pr2resolve-v${{ needs.validate.outputs.version }}-linux-x86_64.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - validate
      - build-windows
      - build-macos
      - build-linux
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.validate.outputs.tag }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-artifacts

      - name: Generate checksums and release notes
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t FILES < <(find release-artifacts -type f \( -name 'pr2resolve-v*.zip' -o -name 'pr2resolve-v*.tar.gz' \) | sort)
          if [ "${#FILES[@]}" -ne 3 ]; then
            echo "FATAL: expected 3 release assets, found ${#FILES[@]}"
            printf '  %s\n' "${FILES[@]}"
            exit 1
          fi

          : > SHA256SUMS.txt
          for file in "${FILES[@]}"; do
            sha256sum "$file" | sed 's#release-artifacts/[^/]*/##' >> SHA256SUMS.txt
          done

          PREVIOUS_TAG="$(python - <<'PY'
          import os
          import subprocess

          current = os.environ["TAG"]

          def parse(tag: str) -> tuple[int, int, int]:
              return tuple(int(part) for part in tag[1:].split("."))

          current_version = parse(current)
          tags = subprocess.check_output(
              ["git", "tag", "--list", "v[0-9]*.[0-9]*.[0-9]*"],
              text=True,
          ).splitlines()
          previous = [
              tag for tag in tags
              if tag != current and parse(tag) < current_version
          ]
          print(max(previous, key=parse) if previous else "")
          PY
          )"
          {
            echo "## pr2resolve ${TAG}"
            echo ""
            echo "Built from tag: \`${TAG}\`"
            echo ""
            echo "### Assets"
            for file in "${FILES[@]}"; do
              echo "- $(basename "$file")"
            done
            echo "- SHA256SUMS.txt"
            echo ""
            if [ -n "$PREVIOUS_TAG" ]; then
              echo "### Changes since ${PREVIOUS_TAG}"
              git log --no-merges --pretty=format:'- %s (%h)' "${PREVIOUS_TAG}..${TAG}"
              echo ""
              echo ""
              echo "Full diff: https://github.com/${GITHUB_REPOSITORY}/compare/${PREVIOUS_TAG}...${TAG}"
            else
              echo "### Changes"
              git log --no-merges --pretty=format:'- %s (%h)' "${TAG}"
              echo ""
            fi
          } > RELEASE_NOTES.md

      - name: Publish draft release with assets
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t FILES < <(find release-artifacts -type f \( -name 'pr2resolve-v*.zip' -o -name 'pr2resolve-v*.tar.gz' \) | sort)
          gh release create "$TAG" \
            "${FILES[@]}" \
            SHA256SUMS.txt \
            --draft \
            --verify-tag \
            --title "pr2resolve ${TAG} - Premiere Pro to DaVinci Resolve converter" \
            --notes-file RELEASE_NOTES.md

      - name: Publish release
        run: gh release edit "$TAG" --draft=false
