name: Bug Report / Bug 反馈
description: Report a CLI, TUI, crash, path, or packaging bug.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Use this form for CLI, TUI, crash, path, or packaging bugs.
        If the problem is about conversion output, use "Conversion Problem" instead.

        这个表单用于 CLI、TUI、崩溃、路径或打包问题。
        如果问题是转换结果不正确，请使用「Conversion Problem / 转换问题」。
  - type: input
    id: pr2resolve-version
    attributes:
      label: pr2resolve version / pr2resolve 版本
      placeholder: "Example: 1.0.3"
    validations:
      required: true
  - type: dropdown
    id: install-mode
    attributes:
      label: How do you run pr2resolve? / 运行方式
      options:
        - Windows release executable
        - Source mode with converter.bat
        - Source mode with converter.sh
        - Direct CLI with python pr2resolve.py
        - Other
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system / 操作系统
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python version / Python 版本
      placeholder: "Example: Python 3.14.5"
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 复现步骤
      placeholder: |
        1. Run ...
        2. Choose/click ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 期望行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际行为
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error output / 错误输出
      description: Remove private paths and project names before posting.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check / 隐私检查
      options:
        - label: I removed private paths, project names, media paths, and client metadata.
          required: true
